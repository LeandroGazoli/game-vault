<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradientes de Alta Fidelidade -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1015"/>
      <stop offset="100%" stop-color="#181a24"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Filtro de Brilho Neon (Glow) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados modernos -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Escudo / Vault de Segurança -->
  <path d="M256 64 C350 64, 410 90, 410 140 C410 290, 340 390, 256 440 C172 390, 102 290, 102 140 C102 90, 162 64, 256 64 Z" 
        fill="url(#shieldFill)" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        filter="url(#neonGlow)"/>

  <!-- Contorno Interno do Escudo -->
  <path d="M256 94 C330 94, 380 114, 380 154 C380 274, 324 358, 256 400 C188 358, 132 274, 132 154 C132 114, 182 94, 256 94 Z" 
        fill="none" 
        stroke="#00E5FF" 
        stroke-width="3" 
        stroke-opacity="0.4"/>

  <!-- Gamepad / Controle Gamer Central em Neon -->
  <g filter="url(#neonGlow)" transform="translate(0, 8)">
    <!-- Corpo do Controle -->
    <path d="M190 190 C220 180, 292 180, 322 190 C365 204, 395 240, 380 320 C370 375, 335 375, 310 335 C295 310, 280 295, 256 295 C232 295, 217 310, 202 335 C177 375, 142 375, 132 320 C117 240, 147 204, 190 190 Z" 
          fill="#111827" 
          stroke="url(#cyanNeon)" 
          stroke-width="12" 
          stroke-linejoin="round"/>

    <!-- D-Pad (Direcionais em Cruz) -->
    <path d="M195 230 L210 230 L210 245 L225 245 L225 260 L210 260 L210 275 L195 275 L195 260 L180 260 L180 245 L195 245 Z" 
          fill="#00E5FF" />

    <!-- Botões de Ação (A, B, X, Y) -->
    <circle cx="317" cy="237" r="7" fill="#00E5FF"/>
    <circle cx="332" cy="252" r="7" fill="#00E5FF"/>
    <circle cx="302" cy="252" r="7" fill="#00E5FF"/>
    <circle cx="317" cy="267" r="7" fill="#00E5FF"/>

    <!-- Thumbsticks / Analógicos com Centro Iluminado -->
    <circle cx="215" cy="295" r="18" fill="#1e293b" stroke="#00E5FF" stroke-width="4"/>
    <circle cx="215" cy="295" r="6" fill="#00E5FF"/>

    <circle cx="297" cy="295" r="18" fill="#1e293b" stroke="#00E5FF" stroke-width="4"/>
    <circle cx="297" cy="295" r="6" fill="#00E5FF"/>

    <!-- Fechadura / Vault Keyhole no Centro Inferior -->
    <circle cx="256" cy="360" r="10" fill="#00E5FF"/>
    <path d="M250 366 L262 366 L266 384 L246 384 Z" fill="#00E5FF"/>
  </g>
</svg>
